<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg-azblob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#12151c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" fill="url(#bg-azblob)"/>
  <rect x="0.5" y="0.5" width="1199" height="619" fill="none" stroke="#2a2f3a"/>

  <text x="60" y="88" fill="#e7e9ee" font-size="46" font-weight="700">Azure Blob <tspan fill="#6ea8fe">CSV</tspan></text>
  <text x="62" y="128" fill="#9aa3b2" font-size="22">Folder path picks the Kafka topic. Blobs stay put.</text>
  <circle cx="68" cy="168" r="6" fill="#4ade80"/>
  <text x="84" y="174" fill="#4ade80" font-size="16" font-weight="600">Kafka 8.3.2 KRaft</text>
  <text x="268" y="174" fill="#9aa3b2" font-size="16">&#183; cp-server-connect &#183; poll every 10s</text>

  <g transform="translate(48,210)">
    <rect width="320" height="268" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="42" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">BLOB</text>
    <text x="24" y="82" fill="#e7e9ee" font-size="26" font-weight="600">csv-data</text>
    <text x="24" y="112" fill="#9aa3b2" font-size="16">Azure Blob Storage</text>
    <rect x="24" y="138" width="272" height="34" rx="8" fill="#1e222b"/>
    <text x="38" y="160" fill="#6ea8fe" font-size="13" font-family="monospace">input/employees/*.csv</text>
    <rect x="24" y="182" width="272" height="34" rx="8" fill="#1e222b"/>
    <text x="38" y="204" fill="#6ea8fe" font-size="13" font-family="monospace">input/new_hires/*.csv</text>
    <text x="24" y="244" fill="#9aa3b2" font-size="14" font-family="monospace">upload-csv.sh</text>
  </g>

  <text x="382" y="356" fill="#6ea8fe" font-size="32" font-weight="700">&#8594;</text>

  <g transform="translate(430,210)">
    <rect width="320" height="268" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="42" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">CONNECT</text>
    <text x="24" y="82" fill="#e7e9ee" font-size="26" font-weight="600">Blob source</text>
    <text x="24" y="112" fill="#9aa3b2" font-size="16">GENERIC, CSV format</text>
    <rect x="24" y="138" width="272" height="34" rx="8" fill="#1e222b"/>
    <text x="38" y="160" fill="#6ea8fe" font-size="13" font-family="monospace">topic.regex.list</text>
    <rect x="24" y="182" width="272" height="34" rx="8" fill="#1e222b"/>
    <text x="38" y="204" fill="#e7e9ee" font-size="13" font-family="monospace">.env at startup</text>
    <text x="24" y="244" fill="#9aa3b2" font-size="14" font-family="monospace">30-day trial</text>
  </g>

  <text x="764" y="356" fill="#6ea8fe" font-size="32" font-weight="700">&#8594;</text>

  <g transform="translate(812,210)">
    <rect width="340" height="268" rx="14" fill="#171a21" stroke="#6ea8fe"/>
    <text x="24" y="42" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">TOPICS</text>
    <text x="24" y="82" fill="#e7e9ee" font-size="26" font-weight="600">Two topics</text>
    <text x="24" y="112" fill="#9aa3b2" font-size="16">Kafka UI on :8080</text>
    <rect x="24" y="138" width="292" height="34" rx="8" fill="#1e222b"/>
    <text x="38" y="160" fill="#4ade80" font-size="14" font-family="monospace">employee-data</text>
    <rect x="24" y="182" width="292" height="34" rx="8" fill="#1e222b"/>
    <text x="38" y="204" fill="#4ade80" font-size="14" font-family="monospace">new-hires</text>
    <text x="24" y="244" fill="#9aa3b2" font-size="14" font-family="monospace">offsets topic</text>
  </g>

  <text x="48" y="520" fill="#9aa3b2" font-size="16" font-family="monospace">employees &#8594; employee-data     new_hires &#8594; new-hires</text>

  <g fill="#9aa3b2" font-size="14">
    <rect x="48" y="548" width="72" height="30" rx="15" fill="#1e222b"/><text x="84" y="568" text-anchor="middle">Kafka</text>
    <rect x="132" y="548" width="130" height="30" rx="15" fill="#1e222b"/><text x="197" y="568" text-anchor="middle">Kafka Connect</text>
    <rect x="274" y="548" width="168" height="30" rx="15" fill="#1e222b"/><text x="358" y="568" text-anchor="middle">Azure Blob Storage</text>
    <rect x="454" y="548" width="78" height="30" rx="15" fill="#1e222b"/><text x="493" y="568" text-anchor="middle">Docker</text>
    <rect x="544" y="548" width="70" height="30" rx="15" fill="#1e222b"/><text x="579" y="568" text-anchor="middle">KRaft</text>
  </g>
</svg>
