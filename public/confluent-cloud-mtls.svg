<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#12151c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="619" fill="none" stroke="#2a2f3a"/>

  <text x="48" y="78" fill="#e7e9ee" font-size="44" font-weight="700">Confluent Cloud <tspan fill="#6ea8fe">mTLS</tspan></text>
  <text x="50" y="118" fill="#9aa3b2" font-size="22">Private CA certificates, CEL pools, AWS PrivateLink</text>
  <circle cx="58" cy="156" r="6" fill="#4ade80"/>
  <text x="76" y="162" fill="#4ade80" font-size="16" font-weight="600">certificate is the credential</text>
  <text x="348" y="162" fill="#9aa3b2" font-size="16">&#183; PKCS12 keystore &#183; security.protocol=SSL</text>

  <g transform="translate(40,196)">
    <rect width="330" height="292" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="44" fill="#9aa3b2" font-size="14" font-weight="600" letter-spacing="0.8">LAPTOP</text>
    <text x="24" y="86" fill="#e7e9ee" font-size="28" font-weight="600">Your CA</text>
    <text x="24" y="118" fill="#9aa3b2" font-size="16">Root, then issuing CA</text>
    <rect x="24" y="146" width="282" height="40" rx="8" fill="#1e222b"/>
    <text x="40" y="172" fill="#6ea8fe" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">OU=payments</text>
    <text x="24" y="220" fill="#e7e9ee" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">keystore.p12</text>
    <text x="24" y="252" fill="#9aa3b2" font-size="16">CRL built locally</text>
    <text x="24" y="278" fill="#9aa3b2" font-size="15">CA keys stay on this machine</text>
  </g>

  <text x="384" y="330" fill="#6ea8fe" font-size="32" font-weight="700">&#8594;</text>
  <text x="368" y="360" fill="#9aa3b2" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">S3</text>

  <g transform="translate(430,196)">
    <rect width="330" height="292" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="44" fill="#9aa3b2" font-size="14" font-weight="600" letter-spacing="0.8">AWS VPC</text>
    <text x="24" y="86" fill="#e7e9ee" font-size="28" font-weight="600">EC2 via SSM</text>
    <text x="24" y="118" fill="#9aa3b2" font-size="16">No SSH, no inbound ports</text>
    <rect x="24" y="146" width="282" height="40" rx="8" fill="#1e222b"/>
    <text x="40" y="172" fill="#f5b942" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SSL :9092</text>
    <text x="24" y="220" fill="#e7e9ee" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">librdkafka &#183; Java CLI</text>
    <text x="24" y="252" fill="#9aa3b2" font-size="16">Python client on the host</text>
    <text x="24" y="278" fill="#9aa3b2" font-size="15">VPC endpoint + Route 53</text>
  </g>

  <text x="774" y="330" fill="#6ea8fe" font-size="32" font-weight="700">&#8594;</text>
  <text x="748" y="360" fill="#9aa3b2" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PL</text>

  <g transform="translate(830,196)">
    <rect width="330" height="292" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="44" fill="#9aa3b2" font-size="14" font-weight="600" letter-spacing="0.8">CONFLUENT CLOUD</text>
    <text x="24" y="86" fill="#e7e9ee" font-size="28" font-weight="600">CEL pools</text>
    <text x="24" y="118" fill="#9aa3b2" font-size="16">Filter match, then RBAC</text>
    <rect x="24" y="146" width="282" height="40" rx="8" fill="#1e222b"/>
    <text x="40" y="172" fill="#4ade80" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">topic=orders</text>
    <text x="24" y="220" fill="#e7e9ee" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DeveloperWrite</text>
    <text x="24" y="252" fill="#4ade80" font-size="16" font-weight="600">orders-producer allowed</text>
    <text x="24" y="278" fill="#9aa3b2" font-size="15">CRL enforced fail-closed</text>
  </g>

  <text x="48" y="548" fill="#9aa3b2" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">OpenSSL &#8594; keystore.p12 &#8594; EC2 &#8594; PrivateLink &#8594; CA + CEL &#8594; Kafka</text>
  <text x="48" y="586" fill="#9aa3b2" font-size="15">marketing OU times out &#183; rogue CA rejected &#183; CRL fail-closed</text>
</svg>
