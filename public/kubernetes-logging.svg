<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#12151c"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="619" fill="none" stroke="#2a2f3a"/>

  <!-- header -->
  <text x="60" y="96" fill="#e7e9ee" font-size="48" font-weight="700">CFK Logs <tspan fill="#6ea8fe">&#8594;</tspan> Splunk</text>
  <text x="62" y="140" fill="#9aa3b2" font-size="24">Confluent for Kubernetes &#183; OpenTelemetry Collector &#183; HEC</text>
  <circle cx="68" cy="182" r="6" fill="#4ade80"/>
  <text x="84" y="188" fill="#4ade80" font-size="16" font-weight="600">JSON to index</text>
  <text x="220" y="188" fill="#9aa3b2" font-size="16">&#183; DaemonSet tails stdout &#183; namespace annotations route</text>

  <!-- FLOW: CFK -->
  <g transform="translate(60,240)">
    <rect width="300" height="280" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="48" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">SOURCE</text>
    <text x="24" y="88" fill="#e7e9ee" font-size="26" font-weight="600">CFK Pods</text>
    <text x="24" y="118" fill="#9aa3b2" font-size="15">Connect &#183; Kafka &#183; ksqlDB</text>
    <rect x="24" y="150" width="252" height="36" rx="8" fill="#1e222b"/>
    <text x="40" y="174" fill="#6ea8fe" font-size="14" font-family="monospace">Log4j2 JSON stdout</text>
    <text x="24" y="220" fill="#e7e9ee" font-size="15" font-family="monospace">ns: confluent</text>
    <text x="24" y="250" fill="#9aa3b2" font-size="14">kubelet writes node logs</text>
  </g>

  <!-- arrow 1 -->
  <text x="390" y="390" fill="#6ea8fe" font-size="28" font-weight="700">&#8594;</text>

  <!-- FLOW: OTel -->
  <g transform="translate(430,240)">
    <rect width="300" height="280" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="48" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">COLLECTOR</text>
    <text x="24" y="88" fill="#e7e9ee" font-size="26" font-weight="600">Splunk OTel</text>
    <text x="24" y="118" fill="#9aa3b2" font-size="15">DaemonSet on every node</text>
    <rect x="24" y="150" width="252" height="36" rx="8" fill="#1e222b"/>
    <text x="40" y="174" fill="#f5b942" font-size="14" font-family="monospace">tails container logs</text>
    <text x="24" y="220" fill="#e7e9ee" font-size="15" font-family="monospace">+ k8s metadata</text>
    <text x="24" y="250" fill="#9aa3b2" font-size="14">pod &#183; ns &#183; cluster name</text>
  </g>

  <!-- arrow 2 -->
  <text x="760" y="390" fill="#6ea8fe" font-size="28" font-weight="700">&#8594;</text>

  <!-- FLOW: Splunk -->
  <g transform="translate(800,240)">
    <rect width="340" height="280" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="48" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">SINK</text>
    <text x="24" y="88" fill="#e7e9ee" font-size="26" font-weight="600">Splunk HEC</text>
    <text x="24" y="118" fill="#9aa3b2" font-size="15">Cloud / Enterprise</text>
    <rect x="24" y="150" width="292" height="36" rx="8" fill="#1e222b"/>
    <text x="40" y="174" fill="#4ade80" font-size="14" font-family="monospace">index=k8s_logs</text>
    <text x="24" y="220" fill="#e7e9ee" font-size="15" font-family="monospace">_json fields</text>
    <text x="24" y="250" fill="#9aa3b2" font-size="14">severity &#183; textPayload</text>
  </g>
</svg>
