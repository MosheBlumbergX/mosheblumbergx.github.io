<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#12151c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="619" fill="none" stroke="#2a2f3a"/>

  <text x="56" y="78" fill="#e7e9ee" font-size="48" font-weight="700">Client <tspan fill="#6ea8fe">Quotas</tspan></text>
  <text x="58" y="116" fill="#9aa3b2" font-size="22">Same producer, three service accounts, three broker ceilings</text>
  <circle cx="66" cy="152" r="6" fill="#4ade80"/>
  <text x="82" y="158" fill="#4ade80" font-size="16" font-weight="600">held at quota</text>
  <text x="196" y="158" fill="#9aa3b2" font-size="16">· final third of a 3-minute race, no client-side limit</text>

  <g transform="translate(50,186)">
    <rect width="340" height="248" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="44" fill="#e7e9ee" font-size="26" font-weight="600">payments-api</text>
    <text x="24" y="76" fill="#9aa3b2" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">quota 10 MB/s</text>
    <text x="24" y="150" fill="#e7e9ee" font-size="48" font-weight="700">9.91</text>
    <text x="150" y="150" fill="#9aa3b2" font-size="18">MB/s</text>
    <rect x="24" y="178" width="148" height="28" rx="14" fill="#4ade80"/>
    <text x="98" y="197" fill="#08101f" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.4">HELD AT QUOTA</text>
    <text x="24" y="228" fill="#6b7280" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">peak 49.51 · service account</text>
  </g>

  <g transform="translate(430,186)">
    <rect width="340" height="248" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="44" fill="#e7e9ee" font-size="26" font-weight="600">nightly-etl</text>
    <text x="24" y="76" fill="#9aa3b2" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">quota 1 MB/s</text>
    <text x="24" y="150" fill="#e7e9ee" font-size="48" font-weight="700">1.00</text>
    <text x="148" y="150" fill="#9aa3b2" font-size="18">MB/s</text>
    <rect x="24" y="178" width="148" height="28" rx="14" fill="#4ade80"/>
    <text x="98" y="197" fill="#08101f" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.4">HELD AT QUOTA</text>
    <text x="24" y="228" fill="#6b7280" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">peak 46.85 · service account</text>
  </g>

  <g transform="translate(810,186)">
    <rect width="340" height="248" rx="14" fill="#171a21" stroke="#f5b942"/>
    <text x="24" y="44" fill="#e7e9ee" font-size="26" font-weight="600">new-team</text>
    <text x="24" y="76" fill="#f5b942" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">quota none</text>
    <text x="24" y="150" fill="#e7e9ee" font-size="48" font-weight="700">97.77</text>
    <text x="178" y="150" fill="#9aa3b2" font-size="18">MB/s</text>
    <rect x="24" y="178" width="132" height="28" rx="14" fill="#f5b942"/>
    <text x="90" y="197" fill="#08101f" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.4">NO QUOTA</text>
    <text x="24" y="228" fill="#6b7280" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">peak 98.29 · uncapped</text>
  </g>

  <text x="50" y="490" fill="#6b7280" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">service account ──► client quota ──► perf-test (no client limit) ──► broker throttle ──► final MB/s</text>

  <g fill="#9aa3b2" font-size="14">
