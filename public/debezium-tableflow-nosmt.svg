<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#12151c"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="619" fill="none" stroke="#2a2f3a"/>

  <!-- header -->
  <text x="60" y="88" fill="#e7e9ee" font-size="46" font-weight="700">Debezium <tspan fill="#6ea8fe">&#215;</tspan> Tableflow</text>
  <text x="62" y="130" fill="#9aa3b2" font-size="22">MySQL CDC as Iceberg in Snowflake Horizon, before the columns exist</text>
  <circle cx="68" cy="170" r="6" fill="#4ade80"/>
  <text x="84" y="176" fill="#4ade80" font-size="16" font-weight="600">FORWARD + optional</text>
  <text x="268" y="176" fill="#9aa3b2" font-size="16">&#183; no local brokers &#183; value-only Avro &#183; ADLS Gen2</text>

  <!-- CARD 1 MYSQL + CONNECT -->
  <g transform="translate(60,214)">
    <rect width="300" height="268" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="42" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">CDC</text>
    <text x="24" y="80" fill="#e7e9ee" font-size="24" font-weight="600">MySQL + Debezium</text>
    <text x="24" y="110" fill="#9aa3b2" font-size="15">Docker Compose &#183; mydb.team</text>
    <rect x="24" y="140" width="252" height="36" rx="8" fill="#1e222b"/>
    <text x="40" y="164" fill="#6ea8fe" font-size="14" font-family="monospace">binlog &#8594; ExtractField</text>
    <text x="24" y="208" fill="#e7e9ee" font-size="15" font-family="monospace">SASL_SSL to CCloud</text>
    <text x="24" y="238" fill="#9aa3b2" font-size="14">keys JSON, not Avro</text>
  </g>

  <!-- arrow 1 -->
  <text x="384" y="360" fill="#6ea8fe" font-size="28" font-weight="700">&#8594;</text>

  <!-- CARD 2 TABLEFLOW -->
  <g transform="translate(430,214)">
    <rect width="300" height="268" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="42" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">MATERIALIZE</text>
    <text x="24" y="80" fill="#e7e9ee" font-size="24" font-weight="600">Tableflow</text>
    <text x="24" y="110" fill="#9aa3b2" font-size="15">enabled before CDC starts</text>
    <rect x="24" y="140" width="252" height="36" rx="8" fill="#1e222b"/>
    <text x="40" y="164" fill="#f5b942" font-size="14" font-family="monospace">tableflow.Value + tf_bootstrap</text>
    <text x="24" y="208" fill="#e7e9ee" font-size="15" font-family="monospace">nosmt_mydb_team</text>
    <text x="24" y="238" fill="#9aa3b2" font-size="14">Iceberg Parquet on ADLS</text>
  </g>

  <!-- arrow 2 -->
  <text x="754" y="360" fill="#6ea8fe" font-size="28" font-weight="700">&#8594;</text>

  <!-- CARD 3 SNOWFLAKE -->
  <g transform="translate(800,214)">
    <rect width="340" height="268" rx="14" fill="#171a21" stroke="#6ea8fe"/>
    <text x="24" y="42" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">QUERY</text>
    <text x="24" y="80" fill="#e7e9ee" font-size="24" font-weight="600">Horizon Catalog</text>
    <text x="24" y="110" fill="#9aa3b2" font-size="15">Iceberg table, all NULLABLE</text>
    <rect x="24" y="140" width="292" height="36" rx="8" fill="#1e222b"/>
    <text x="40" y="164" fill="#4ade80" font-size="14" font-family="monospace">SELECT * FROM NOSMT_MYDB_TEAM</text>
    <text x="24" y="208" fill="#e7e9ee" font-size="15" font-family="monospace">NOSMT_TABLEFLOW_DB.CONFLUENT</text>
    <text x="24" y="238" fill="#9aa3b2" font-size="14">ALTER TABLE adds optional fields</text>
  </g>

  <!-- tag chips -->
  <g fill="#9aa3b2" font-size="14">
    <rect x="60"  y="548" width="92"  height="30" rx="15" fill="#1e222b"/><text x="106" y="568" text-anchor="middle">Debezium</text>
    <rect x="164" y="548" width="70"  height="30" rx="15" fill="#1e222b"/><text x="199" y="568" text-anchor="middle">MySQL</text>
    <rect x="246" y="548" width="88"  height="30" rx="15" fill="#1e222b"/><text x="290" y="568" text-anchor="middle">Tableflow</text>
    <rect x="346" y="548" width="92"  height="30" rx="15" fill="#1e222b"/><text x="392" y="568" text-anchor="middle">Snowflake</text>
    <rect x="450" y="548" width="78"  height="30" rx="15" fill="#1e222b"/><text x="489" y="568" text-anchor="middle">Iceberg</text>
    <rect x="540" y="548" width="62"  height="30" rx="15" fill="#1e222b"/><text x="571" y="568" text-anchor="middle">Avro</text>
  </g>
</svg>
