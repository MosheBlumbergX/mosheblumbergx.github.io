    <rect x="578" y="540" width="108" height="30" rx="15" fill="#1e222b"/>
    <text x="632" y="560" text-anchor="middle">Terraform</text>
    <rect x="698" y="540" width="84" height="30" rx="15" fill="#1e222b"/>
