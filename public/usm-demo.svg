<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#12151c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="619" fill="none" stroke="#2a2f3a"/>

  <text x="60" y="64" fill="#e7e9ee" font-size="40" font-weight="700">USM Demo: CP in the <tspan fill="#6ea8fe">Cloud UI</tspan></text>
  <text x="62" y="100" fill="#9aa3b2" font-size="20">EKS dials Confluent Cloud. The laptop dials back.</text>
  <circle cx="68" cy="136" r="6" fill="#4ade80"/>
  <text x="84" y="142" fill="#4ade80" font-size="16" font-weight="600">PrivateLink only</text>
  <text x="240" y="142" fill="#9aa3b2" font-size="16">&#183; CFK 3.3 &#183; CP 8.3 &#183; users &#183; pageviews &#183; Control Center</text>

  <g transform="translate(48,168)">
    <rect width="320" height="236" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="36" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">EKS</text>
    <text x="24" y="72" fill="#e7e9ee" font-size="24" font-weight="600">Confluent Platform</text>
    <text x="24" y="100" fill="#9aa3b2" font-size="15">KRaft &#183; Kafka &#183; Connect &#183; SR</text>
    <rect x="24" y="118" width="272" height="34" rx="8" fill="#1e222b"/>
    <text x="40" y="140" fill="#6ea8fe" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">users &#183; pageviews (Avro)</text>
    <text x="24" y="180" fill="#e7e9ee" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ks-validate &#183; S3 sink</text>
    <text x="24" y="208" fill="#9aa3b2" font-size="14">namespace usm &#183; CP 8.3.0</text>
  </g>

  <text x="384" y="296" fill="#6ea8fe" font-size="28" font-weight="700">&#8594;</text>

  <g transform="translate(424,168)">
    <rect width="320" height="236" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="36" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">DIAL OUT</text>
    <text x="24" y="72" fill="#e7e9ee" font-size="24" font-weight="600">PrivateLink</text>
    <text x="24" y="100" fill="#9aa3b2" font-size="15">VPC endpoint &#183; access point</text>
    <rect x="24" y="118" width="272" height="34" rx="8" fill="#1e222b"/>
    <text x="40" y="140" fill="#f5b942" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">USM Agent 1.2.1</text>
    <text x="24" y="180" fill="#e7e9ee" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cluster link: source</text>
    <text x="24" y="208" fill="#9aa3b2" font-size="14">schema exporter &#183; NONE</text>
  </g>

  <text x="760" y="296" fill="#6ea8fe" font-size="28" font-weight="700">&#8594;</text>

  <g transform="translate(800,168)">
    <rect width="352" height="236" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="36" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">CONFLUENT CLOUD</text>
    <text x="24" y="72" fill="#e7e9ee" font-size="24" font-weight="600">One environment</text>
    <text x="24" y="100" fill="#9aa3b2" font-size="15">USM view + Enterprise cluster</text>
    <rect x="24" y="118" width="304" height="34" rx="8" fill="#1e222b"/>
    <text x="40" y="140" fill="#4ade80" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">mirrors: users &#183; pageviews</text>
    <text x="24" y="180" fill="#e7e9ee" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pageviews-value, same ID</text>
    <text x="24" y="208" fill="#9aa3b2" font-size="14">orders from managed Datagen</text>
  </g>

  <g transform="translate(48,422)">
    <rect width="1104" height="160" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="36" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">LAPTOP</text>

    <text x="24" y="74" fill="#e7e9ee" font-size="20" font-weight="600">Control Center 2.6</text>
    <rect x="24" y="90" width="300" height="32" rx="8" fill="#1e222b"/>
    <text x="40" y="111" fill="#6ea8fe" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make c3 &#8594; localhost:9021</text>
    <text x="24" y="146" fill="#9aa3b2" font-size="14">port-forward &#183; Prometheus :9090</text>

    <text x="560" y="74" fill="#e7e9ee" font-size="20" font-weight="600">Cloud Console</text>
    <rect x="560" y="90" width="360" height="32" rx="8" fill="#1e222b"/>
    <text x="576" y="111" fill="#4ade80" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hosts + pf 443 &#8594; 18443</text>
    <text x="560" y="146" fill="#9aa3b2" font-size="14">console-proxy &#183; ssl_preread &#183; PrivateLink</text>
  </g>
