<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#12151c"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="619" fill="none" stroke="#2a2f3a"/>

  <!-- header -->
  <text x="60" y="88" fill="#e7e9ee" font-size="46" font-weight="700">Tableflow <tspan fill="#6ea8fe">&#215;</tspan> Snowflake</text>
  <text x="62" y="130" fill="#9aa3b2" font-size="22">Kafka topics as Iceberg tables in Horizon Catalog</text>
  <circle cx="68" cy="170" r="6" fill="#4ade80"/>
  <text x="84" y="176" fill="#4ade80" font-size="16" font-weight="600">AUTO_REFRESH</text>
  <text x="230" y="176" fill="#9aa3b2" font-size="16">&#183; IRC + ADLS Gen2 &#183; two-phase Azure consent</text>

  <!-- CARD 1 KAFKA -->
  <g transform="translate(60,214)">
    <rect width="300" height="268" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="42" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">PRODUCE</text>
    <text x="24" y="80" fill="#e7e9ee" font-size="24" font-weight="600">Kafka topic</text>
    <text x="24" y="110" fill="#9aa3b2" font-size="15">Datagen &#183; stock_trades</text>
    <rect x="24" y="140" width="252" height="36" rx="8" fill="#1e222b"/>
    <text x="40" y="164" fill="#6ea8fe" font-size="14" font-family="monospace">Avro + Schema Registry</text>
    <text x="24" y="208" fill="#e7e9ee" font-size="15" font-family="monospace">topic: stocks</text>
    <text x="24" y="238" fill="#9aa3b2" font-size="14">Confluent Cloud on Azure</text>
  </g>

  <!-- arrow 1 -->
  <text x="384" y="360" fill="#6ea8fe" font-size="28" font-weight="700">&#8594;</text>

  <!-- CARD 2 TABLEFLOW -->
  <g transform="translate(430,214)">
    <rect width="300" height="268" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="42" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">MATERIALIZE</text>
    <text x="24" y="80" fill="#e7e9ee" font-size="24" font-weight="600">Tableflow</text>
    <text x="24" y="110" fill="#9aa3b2" font-size="15">Iceberg REST Catalog</text>
    <rect x="24" y="140" width="252" height="36" rx="8" fill="#1e222b"/>
    <text x="40" y="164" fill="#f5b942" font-size="14" font-family="monospace">ADLS Gen2 &#183; Parquet</text>
    <text x="24" y="208" fill="#e7e9ee" font-size="15" font-family="monospace">tableflow.*.azure/iceberg</text>
    <text x="24" y="238" fill="#9aa3b2" font-size="14">BYOS + provider integration</text>
  </g>

  <!-- arrow 2 -->
  <text x="754" y="360" fill="#6ea8fe" font-size="28" font-weight="700">&#8594;</text>

  <!-- CARD 3 SNOWFLAKE -->
  <g transform="translate(800,214)">
    <rect width="340" height="268" rx="14" fill="#171a21" stroke="#6ea8fe"/>
    <text x="24" y="42" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">QUERY</text>
    <text x="24" y="80" fill="#e7e9ee" font-size="24" font-weight="600">Horizon Catalog</text>
    <text x="24" y="110" fill="#9aa3b2" font-size="15">Unmanaged Iceberg table</text>
    <rect x="24" y="140" width="292" height="36" rx="8" fill="#1e222b"/>
    <text x="40" y="164" fill="#4ade80" font-size="14" font-family="monospace">SELECT * FROM STOCKS</text>
    <text x="24" y="208" fill="#e7e9ee" font-size="15" font-family="monospace">blob:// + OAuth catalog</text>
    <text x="24" y="238" fill="#9aa3b2" font-size="14">poll IRC every 30s</text>
  </g>

  <!-- tag chips -->
  <g fill="#9aa3b2" font-size="14">
    <rect x="60"  y="548" width="92"  height="30" rx="15" fill="#1e222b"/><text x="106" y="568" text-anchor="middle">Terraform</text>
    <rect x="164" y="548" width="92"  height="30" rx="15" fill="#1e222b"/><text x="210" y="568" text-anchor="middle">Snowflake</text>
    <rect x="268" y="548" width="66"  height="30" rx="15" fill="#1e222b"/><text x="301" y="568" text-anchor="middle">Kafka</text>
    <rect x="346" y="548" width="78"  height="30" rx="15" fill="#1e222b"/><text x="385" y="568" text-anchor="middle">Iceberg</text>
    <rect x="436" y="548" width="92"  height="30" rx="15" fill="#1e222b"/><text x="482" y="568" text-anchor="middle">Confluent</text>
    <rect x="540" y="548" width="66"  height="30" rx="15" fill="#1e222b"/><text x="573" y="568" text-anchor="middle">Azure</text>
  </g>
</svg>
