<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#12151c"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="619" fill="none" stroke="#2a2f3a"/>

  <!-- header -->
  <text x="60" y="88" fill="#e7e9ee" font-size="52" font-weight="700">GC <tspan fill="#6ea8fe">Lab</tspan></text>
  <text x="62" y="130" fill="#9aa3b2" font-size="22">Java 21 demos for heap, Metaspace, direct OOM, and zombie processes</text>
  <circle cx="68" cy="170" r="6" fill="#4ade80"/>
  <text x="84" y="176" fill="#4ade80" font-size="16" font-weight="600">no Kafka cluster</text>
  <text x="250" y="176" fill="#9aa3b2" font-size="16">&#183; in-process scenarios &#183; G1GC &#183; jstat / jcmd</text>

  <!-- CARD 1: healthy -->
  <g transform="translate(60,214)">
    <rect width="340" height="286" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="42" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">HEALTHY</text>
    <text x="24" y="82" fill="#e7e9ee" font-size="26" font-weight="600">Eden sawtooth</text>
    <text x="24" y="112" fill="#9aa3b2" font-size="15">short-lived objects die young</text>
    <rect x="24" y="140" width="292" height="36" rx="8" fill="#1e222b"/>
    <text x="40" y="164" fill="#4ade80" font-size="14" font-family="monospace">young GC reclaims Eden</text>
    <text x="24" y="214" fill="#e7e9ee" font-size="15" font-family="monospace">run-healthy.sh</text>
    <text x="24" y="248" fill="#9aa3b2" font-size="14">heap flat &#183; Kafka request path</text>
  </g>

  <!-- CARD 2: three OOMs -->
  <g transform="translate(430,214)">
    <rect width="340" height="286" rx="14" fill="#171a21" stroke="#2a2f3a"/>
    <text x="24" y="42" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">THREE OOMs</text>
    <text x="24" y="82" fill="#e7e9ee" font-size="26" font-weight="600">Not just heap</text>
    <text x="24" y="112" fill="#9aa3b2" font-size="15">-Xmx is only one cap</text>
    <rect x="24" y="140" width="292" height="36" rx="8" fill="#1e222b"/>
    <text x="40" y="164" fill="#6ea8fe" font-size="14" font-family="monospace">heap &#183; metaspace &#183; direct</text>
    <text x="24" y="214" fill="#e7e9ee" font-size="15" font-family="monospace">Java heap space</text>
    <text x="24" y="248" fill="#9aa3b2" font-size="14">Metaspace &#183; Direct buffer memory</text>
  </g>

  <!-- CARD 3: zombies -->
  <g transform="translate(800,214)">
    <rect width="340" height="286" rx="14" fill="#171a21" stroke="#6ea8fe"/>
    <text x="24" y="42" fill="#9aa3b2" font-size="13" font-weight="600" letter-spacing="0.8">TWO ZOMBIES</text>
    <text x="24" y="82" fill="#e7e9ee" font-size="26" font-weight="600">PID up, work dead</text>
    <text x="24" y="112" fill="#9aa3b2" font-size="15">the dangerous broker case</text>
    <rect x="24" y="140" width="292" height="36" rx="8" fill="#1e222b"/>
    <text x="40" y="164" fill="#f5b942" font-size="14" font-family="monospace">thrash &#183; caught Error</text>
    <text x="24" y="214" fill="#e7e9ee" font-size="15" font-family="monospace">heartbeat still green</text>
    <text x="24" y="248" fill="#9aa3b2" font-size="14">ISR flaps &#183; missed poll</text>
  </g>

  <!-- flow strip -->
  <text x="60" y="548" fill="#6b7280" font-size="15" font-family="monospace">alloc &#8594; Eden &#8594; reclaim | tenure | Metaspace | direct &#8594; OOM or zombie</text>
  <text x="60" y="580" fill="#6b7280" font-size="14">Java 21 &#183; Maven &#183; G1GC &#183; Kafka mapping in docs/05</text>
</svg>
